name: MovieApp Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov selenium webdriver-manager

    # Cài đặt Chrome cho Selenium
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@latest
      with:
        chrome-version: stable

    - name: Run Pytest
      env:
        # Quan trọng: Phải để dấu chấm (.) để Python hiểu thư mục gốc là module
        PYTHONPATH: .
        DATABASE_URL: sqlite:///test_db.sqlite
      run: |
        # Khởi tạo database bằng dữ liệu JSON thật
        python create_db.py
        # Khởi động Flask server ngầm
        python movieapp/index.py &
        
        # Chờ server sẵn sàng (tăng lên 10s cho chắc chắn)
        sleep 10
        
        # Chạy toàn bộ test
        pytest movieapp/test/ --cov=movieapp --cov-report=term-missing